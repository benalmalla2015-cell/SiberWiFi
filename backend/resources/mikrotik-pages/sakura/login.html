<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{network_name}} — تسجيل الدخول</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 18px;
  background: linear-gradient(160deg, #fff1f5 0%, #fce7f3 60%, #fbcfe8 100%);
  overflow-x: hidden; }
.petal { position: fixed; border-radius: 60% 40% 55% 45%; background: rgba(244,114,182,.25);
  pointer-events: none; animation: float 9s ease-in-out infinite alternate; }
.p1 { width: 130px; height: 110px; top: 8%; right: 10%; }
.p2 { width: 90px; height: 80px; bottom: 14%; left: 8%; animation-delay: -4s;
  background: rgba(190,24,93,.12); }
.p3 { width: 70px; height: 64px; top: 55%; right: 78%; animation-delay: -7s;
  background: rgba(251,207,232,.5); }
@keyframes float { from { transform: translateY(0) rotate(0); }
  to { transform: translateY(-24px) rotate(12deg); } }
.card { width: 100%; max-width: 380px; padding: 38px 30px 26px; text-align: center;
  background: rgba(255,255,255,.9); border: 1px solid rgba(244,114,182,.3);
  border-radius: 28px; backdrop-filter: blur(8px); position: relative;
  box-shadow: 0 24px 55px rgba(190,24,93,.16); animation: up .5s ease both; }
@keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; } }
.bloom { font-size: 36px; display: block; margin-bottom: 6px; }
.logo { max-height: 60px; max-width: 135px; margin-bottom: 8px; }
h1 { font-size: 24px; color: {{color_primary}}; font-weight: 800; }
.sub { color: #9d4d70; font-size: 13px; margin: 8px 0 20px; line-height: 1.7; }
.speed { display: inline-block; background: #fdf2f8; color: {{color_primary}};
  border: 1px solid #f9a8d4; border-radius: 999px; font-size: 12px; font-weight: 700;
  padding: 4px 14px; margin-bottom: 14px; }
.speed:empty { display: none; }
input[type=text], input[type=password] { width: 100%; padding: 15px 16px; margin-bottom: 13px;
  border: 2px solid #fbcfe8; border-radius: 16px; background: #fff; font-size: 15px;
  font-family: inherit; text-align: center; transition: border .15s; }
input:focus { outline: none; border-color: {{color_accent}}; }
button { width: 100%; padding: 15px; border: 0; border-radius: 16px;
  background: linear-gradient(135deg, {{color_accent}}, {{color_primary}} 160%);
  color: #fff; font-size: 16px; font-weight: 800; font-family: inherit; cursor: pointer;
  box-shadow: 0 10px 26px rgba(190,24,93,.3); transition: transform .12s; }
button:hover { transform: translateY(-1px); }
.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca;
  border-radius: 14px; padding: 11px; font-size: 13px; margin-bottom: 14px; }
.trial { margin-top: 16px; font-size: 13px; color: #9d4d70; }
.trial a { color: {{color_primary}}; font-weight: 800; text-decoration: none; }
.foot { margin-top: 20px; font-size: 12px; color: #c48aa6; }
.foot a { color: {{color_primary}}; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
$(if chap-id)
<form name="sendin" action="$(link-login-only)" method="post">
<input type="hidden" name="username" />
<input type="hidden" name="password" />
<input type="hidden" name="dst" value="$(link-orig)" />
<input type="hidden" name="popup" value="true" />
</form>
<script type="text/javascript" src="md5.js"></script>
<script type="text/javascript">
function doLogin() {
  document.sendin.username.value = document.login.username.value;
  document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
  document.sendin.submit();
  return false;
}
</script>
$(endif)

<div class="petal p1"></div><div class="petal p2"></div><div class="petal p3"></div>
<div class="card">
  <span class="bloom">🌸</span>
  {{logo}}
  <h1>{{network_name}}</h1>
  <div class="sub">{{welcome_msg}}</div>
  <div class="speed">⚡ {{speed_label}}</div>
  $(if error)<div class="error">$(error)</div>$(endif)
  <form name="login" action="$(link-login-only)" method="post"
        $(if chap-id) onSubmit="return doLogin()" $(endif)>
    <input type="hidden" name="dst" value="$(link-orig)" />
    <input type="hidden" name="popup" value="true" />
    <input name="username" type="text" value="$(username)" placeholder="اسم المستخدم / رقم الكرت" autocomplete="username" />
    <input name="password" type="password" placeholder="كلمة المرور" autocomplete="current-password" />
    <button type="submit">دخول</button>
  </form>
  $(if trial == 'yes')
  <div class="trial"><a href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)">دخول تجريبي مجاني ←</a></div>
  $(endif)
  <div class="foot">{{support_line}}</div>
</div>
</body>
</html>
