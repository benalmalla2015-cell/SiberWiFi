<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{network_name}} — تسجيل الدخول</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 18px;
  background: linear-gradient(180deg, #082f49 0%, {{color_primary}} 60%, #02121f 100%);
  overflow: hidden; }
.wave { position: fixed; bottom: -40px; right: -50%; width: 200%; height: 200px;
  background: rgba(14,165,233,.14); border-radius: 42%;
  animation: wave 9s linear infinite; pointer-events: none; }
.wave.w2 { background: rgba(14,165,233,.09); animation-duration: 13s;
  animation-direction: reverse; height: 230px; }
.wave.w3 { background: rgba(125,211,252,.06); animation-duration: 17s; height: 260px; }
@keyframes wave { to { transform: rotate(360deg); } }
.card { width: 100%; max-width: 390px; padding: 36px 28px 26px; text-align: center;
  background: rgba(255,255,255,.97); border-radius: 24px; position: relative;
  box-shadow: 0 30px 70px rgba(0,20,40,.5); animation: up .5s ease both; }
@keyframes up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; } }
.logo { max-height: 62px; max-width: 140px; margin-bottom: 8px; }
.boat { font-size: 34px; display: block; margin-bottom: 4px; }
h1 { font-size: 25px; color: #0c2d44; font-weight: 800; }
.sub { color: #4a7086; font-size: 13px; margin: 8px 0 20px; line-height: 1.7; }
.speed { display: inline-block; background: #e0f2fe; color: {{color_primary}};
  border: 1px solid #bae6fd; border-radius: 999px; font-size: 12px;
  font-weight: 700; padding: 4px 14px; margin-bottom: 14px; }
.speed:empty { display: none; }
input[type=text], input[type=password] { width: 100%; padding: 15px 16px; margin-bottom: 13px;
  border: 2px solid #bae6fd; border-radius: 14px; background: #f0f9ff; font-size: 15px;
  font-family: inherit; text-align: center; transition: border .15s; }
input:focus { outline: none; border-color: {{color_accent}}; }
button { width: 100%; padding: 15px; border: 0; border-radius: 14px;
  background: linear-gradient(135deg, {{color_accent}}, {{color_primary}});
  color: #fff; font-size: 16px; font-weight: 800; font-family: inherit; cursor: pointer;
  box-shadow: 0 10px 26px rgba(14,165,233,.4); transition: transform .12s; }
button:hover { transform: translateY(-1px); }
.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca;
  border-radius: 12px; padding: 11px; font-size: 13px; margin-bottom: 14px; }
.trial { margin-top: 16px; font-size: 13px; color: #4a7086; }
.trial a { color: {{color_accent}}; font-weight: 800; text-decoration: none; }
.foot { margin-top: 20px; font-size: 12px; color: #7fa0b5; }
.foot a { color: {{color_primary}}; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
$(if chap-id)
<form name="sendin" action="$(link-login-only)" method="post">
<input type="hidden" name="username" />
<input type="hidden" name="password" />
<input type="hidden" name="dst" value="$(link-orig)" />
<input type="hidden" name="popup" value="true" />
</form>
<script type="text/javascript" src="md5.js"></script>
<script type="text/javascript">
function doLogin() {
  document.sendin.username.value = document.login.username.value;
  document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
  document.sendin.submit();
  return false;
}
</script>
$(endif)

<div class="wave"></div><div class="wave w2"></div><div class="wave w3"></div>
<div class="card">
  <span class="boat">🌊</span>
  {{logo}}
  <h1>{{network_name}}</h1>
  <div class="sub">{{welcome_msg}}</div>
  <div class="speed">⚡ {{speed_label}}</div>
  $(if error)<div class="error">$(error)</div>$(endif)
  <form name="login" action="$(link-login-only)" method="post"
        $(if chap-id) onSubmit="return doLogin()" $(endif)>
    <input type="hidden" name="dst" value="$(link-orig)" />
    <input type="hidden" name="popup" value="true" />
    <input name="username" type="text" value="$(username)" placeholder="اسم المستخدم / رقم الكرت" autocomplete="username" />
    <input name="password" type="password" placeholder="كلمة المرور" autocomplete="current-password" />
    <button type="submit">دخول</button>
  </form>
  $(if trial == 'yes')
  <div class="trial"><a href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)">دخول تجريبي مجاني ←</a></div>
  $(endif)
  <div class="foot">{{support_line}}</div>
</div>
</body>
</html>
