<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{network_name}} — تسجيل الدخول</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", Tahoma, "Helvetica Neue", Arial, sans-serif;
  background: linear-gradient(160deg, #eef2f9 0%, #dde5f2 100%);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.card {
  background: #fff; width: 100%; max-width: 400px;
  border-radius: 20px; overflow: hidden;
  box-shadow: 0 20px 55px rgba(20, 35, 80, .16);
  animation: rise .45s ease both;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: none; }
}
.band {
  background: linear-gradient(135deg, {{color_primary}} 0%, {{color_primary}} 60%, {{color_accent}} 165%);
  padding: 34px 24px 28px; text-align: center; color: #fff;
  position: relative; overflow: hidden;
}
.band::before, .band::after {
  content: ""; position: absolute; border-radius: 50%;
  background: rgba(255,255,255,.07);
}
.band::before { width: 160px; height: 160px; top: -70px; right: -50px; }
.band::after { width: 110px; height: 110px; bottom: -55px; left: -35px; }
.band > * { position: relative; }
.band .logo { max-height: 64px; max-width: 140px; margin-bottom: 12px; }
.band h1 { font-size: 23px; font-weight: 800; letter-spacing: .2px; }
.band p { font-size: 13px; opacity: .85; margin-top: 6px; }
.body { padding: 28px 24px 22px; }
.welcome {
  font-size: 14px; color: #5a6478; text-align: center;
  margin-bottom: 20px; line-height: 1.7;
}
input[type=text], input[type=password] {
  width: 100%; padding: 14px 15px; margin-bottom: 12px;
  border: 1.5px solid #e1e7f0; border-radius: 12px;
  font-size: 15px; font-family: inherit; background: #f8fafd;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
input:focus {
  outline: none; border-color: {{color_primary}}; background: #fff;
  box-shadow: 0 0 0 4px rgba(30, 60, 130, .08);
}
button, .btn {
  display: block; width: 100%; padding: 15px;
  background: linear-gradient(135deg, {{color_accent}} 0%, {{color_primary}} 190%);
  color: #fff; border: 0; border-radius: 12px;
  font-size: 16px; font-weight: 800; font-family: inherit;
  cursor: pointer; letter-spacing: .3px;
  box-shadow: 0 8px 20px rgba(20, 40, 100, .22);
  transition: transform .12s, box-shadow .15s, opacity .15s;
}
button:hover, .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(20,40,100,.28); }
button:active { transform: none; opacity: .92; }
.error {
  background: #fdecea; color: {{color_accent}}; border: 1px solid #f5c6c6;
  border-radius: 10px; padding: 10px 12px; font-size: 13px;
  text-align: center; margin-bottom: 14px;
}
.trial { text-align: center; margin-top: 16px; font-size: 13px; color: #667; }
.trial a { color: {{color_primary}}; font-weight: 700; text-decoration: none; }
.trial a:hover { text-decoration: underline; }
.foot {
  border-top: 1px solid #eef1f6; padding: 15px;
  text-align: center; font-size: 12px; color: #8b94a7;
}
.foot a { color: {{color_primary}}; text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
$(if chap-id)
<form name="sendin" action="$(link-login-only)" method="post">
<input type="hidden" name="username" />
<input type="hidden" name="password" />
<input type="hidden" name="dst" value="$(link-orig)" />
<input type="hidden" name="popup" value="true" />
</form>
<script type="text/javascript" src="md5.js"></script>
<script type="text/javascript">
function doLogin() {
  document.sendin.username.value = document.login.username.value;
  document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
  document.sendin.submit();
  return false;
}
</script>
$(endif)

<div class="card">
  <div class="band">
    {{logo}}
    <h1>{{network_name}}</h1>
    <p>شبكة إنترنت لاسلكية</p>
  </div>
  <div class="body">
    <div class="welcome">{{welcome_msg}}</div>
    $(if error)<div class="error">$(error)</div>$(endif)
    <form name="login" action="$(link-login-only)" method="post"
          $(if chap-id) onSubmit="return doLogin()" $(endif)>
      <input type="hidden" name="dst" value="$(link-orig)" />
      <input type="hidden" name="popup" value="true" />
      <input name="username" type="text" value="$(username)"
             placeholder="اسم المستخدم / رقم الكرت" autocomplete="username" />
      <input name="password" type="password"
             placeholder="كلمة المرور" autocomplete="current-password" />
      <button type="submit">دخول</button>
    </form>
    $(if trial == 'yes')
    <div class="trial">
      ليس لديك كرت؟ <a href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)">جرّب مجاناً</a>
    </div>
    $(endif)
  </div>
  <div class="foot">
    {{support_line}}
  </div>
</div>
</body>
</html>
