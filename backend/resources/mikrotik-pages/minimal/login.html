<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{network_name}} — تسجيل الدخول</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", Tahoma, "Helvetica Neue", Arial, sans-serif;
  background: linear-gradient(180deg, #ffffff 0%, #f6f8fb 100%);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px; color: #1c2430;
}
.wrap {
  width: 100%; max-width: 360px;
  animation: rise .45s ease both;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}
.logo { max-height: 60px; max-width: 130px; margin-bottom: 18px; }
h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; letter-spacing: -.2px; }
.rule {
  width: 46px; height: 4px; border-radius: 4px; margin-bottom: 22px;
  background: linear-gradient(90deg, {{color_accent}}, {{color_primary}});
}
.sub { color: #7a8494; font-size: 13px; margin-bottom: 28px; line-height: 1.7; }
label { display: block; font-size: 12px; font-weight: 700; color: #4a5568; margin-bottom: 6px; }
input[type=text], input[type=password] {
  width: 100%; padding: 13px 4px; margin-bottom: 22px;
  border: 0; border-bottom: 2px solid #e4e8ef;
  font-size: 15px; font-family: inherit; background: transparent;
  transition: border-color .18s;
}
input:focus { outline: none; border-bottom-color: {{color_primary}}; }
button {
  width: 100%; padding: 16px; border: 0; border-radius: 10px;
  background: {{color_primary}}; color: #fff;
  font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer;
  box-shadow: 0 8px 22px rgba(20,40,100,.16);
  transition: transform .12s, box-shadow .15s;
}
button:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(20,40,100,.22); }
button:active { transform: none; }
.error {
  border-right: 3px solid #d33; background: #fdf3f3; color: #b3261e;
  padding: 10px 12px; font-size: 13px; margin-bottom: 20px; border-radius: 6px;
}
.trial { margin-top: 22px; font-size: 13px; }
.trial a {
  color: {{color_primary}}; font-weight: 700; text-decoration: none;
  border-bottom: 1.5px solid {{color_primary}}; padding-bottom: 1px;
}
.foot { margin-top: 44px; font-size: 11px; color: #aab; }
.foot a { color: #667; text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
$(if chap-id)
<form name="sendin" action="$(link-login-only)" method="post">
<input type="hidden" name="username" />
<input type="hidden" name="password" />
<input type="hidden" name="dst" value="$(link-orig)" />
<input type="hidden" name="popup" value="true" />
</form>
<script type="text/javascript" src="md5.js"></script>
<script type="text/javascript">
function doLogin() {
  document.sendin.username.value = document.login.username.value;
  document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
  document.sendin.submit();
  return false;
}
</script>
$(endif)

<div class="wrap">
  {{logo}}
  <h1>{{network_name}}</h1>
  <div class="rule"></div>
  <div class="sub">{{welcome_msg}}</div>
  $(if error)<div class="error">$(error)</div>$(endif)
  <form name="login" action="$(link-login-only)" method="post"
        $(if chap-id) onSubmit="return doLogin()" $(endif)>
    <input type="hidden" name="dst" value="$(link-orig)" />
    <input type="hidden" name="popup" value="true" />
    <label>اسم المستخدم / رقم الكرت</label>
    <input name="username" type="text" value="$(username)" autocomplete="username" />
    <label>كلمة المرور</label>
    <input name="password" type="password" autocomplete="current-password" />
    <button type="submit">دخول</button>
  </form>
  $(if trial == 'yes')
  <div class="trial">
    <a href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)">الدخول التجريبي</a>
  </div>
  $(endif)
  <div class="foot">{{support_line}}</div>
</div>
</body>
</html>
