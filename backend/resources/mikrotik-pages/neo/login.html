<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{network_name}} — تسجيل الدخول</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 18px;
  background: #dde4ef; }
.card { width: 100%; max-width: 380px; background: #dde4ef; border-radius: 30px;
  padding: 38px 30px 26px; text-align: center;
  box-shadow: 18px 18px 36px #b8c0cf, -18px -18px 36px #ffffff; }
.logo { max-height: 60px; max-width: 130px; margin-bottom: 10px; }
h1 { font-size: 23px; color: #37466b; font-weight: 800; }
.sub { color: #7c8aa8; font-size: 13px; margin: 8px 0 22px; line-height: 1.7; }
.speed { display: inline-block; color: {{color_primary}}; font-size: 12px; font-weight: 700;
  border-radius: 999px; padding: 6px 16px; margin-bottom: 16px;
  box-shadow: inset 3px 3px 7px #b8c0cf, inset -3px -3px 7px #fff; }
.speed:empty { display: none; }
input[type=text], input[type=password] { width: 100%; padding: 16px; margin-bottom: 14px;
  border: 0; border-radius: 18px; background: #dde4ef; font-size: 15px;
  font-family: inherit; text-align: center; color: #37466b;
  box-shadow: inset 5px 5px 11px #b8c0cf, inset -5px -5px 11px #fff;
  transition: box-shadow .2s; }
input:focus { outline: none;
  box-shadow: inset 3px 3px 7px #b8c0cf, inset -3px -3px 7px #fff,
    0 0 0 3px rgba(91,127,255,.12); }
button { width: 100%; padding: 16px; border: 0; border-radius: 18px;
  background: linear-gradient(135deg, {{color_primary}}, {{color_accent}});
  color: #fff; font-size: 16px; font-weight: 800; font-family: inherit; cursor: pointer;
  box-shadow: 6px 6px 14px #b8c0cf, -4px -4px 10px #fff; transition: transform .12s; }
button:active { transform: scale(.97); }
.error { background: #dde4ef; color: #c0392b; border-radius: 14px; padding: 12px;
  font-size: 13px; margin-bottom: 14px; box-shadow: inset 3px 3px 7px #b8c0cf; }
.trial { margin-top: 18px; font-size: 13px; color: #7c8aa8; }
.trial a { color: {{color_accent}}; font-weight: 800; text-decoration: none; }
.foot { margin-top: 22px; font-size: 12px; color: #8fa0bd; }
.foot a { color: {{color_primary}}; font-weight: 700; text-decoration: none; }
.wifi { width: 62px; height: 62px; margin: 0 auto 12px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 26px;
  background: linear-gradient(145deg, {{color_primary}}, {{color_accent}});
  box-shadow: 6px 6px 14px #b8c0cf, -6px -6px 14px #fff; }
</style>
</head>
<body>
$(if chap-id)
<form name="sendin" action="$(link-login-only)" method="post">
<input type="hidden" name="username" />
<input type="hidden" name="password" />
<input type="hidden" name="dst" value="$(link-orig)" />
<input type="hidden" name="popup" value="true" />
</form>
<script type="text/javascript" src="md5.js"></script>
<script type="text/javascript">
function doLogin() {
  document.sendin.username.value = document.login.username.value;
  document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
  document.sendin.submit();
  return false;
}
</script>
$(endif)

<div class="card">
  <div class="wifi">📶</div>
  {{logo}}
  <h1>{{network_name}}</h1>
  <div class="sub">{{welcome_msg}}</div>
  <div class="speed">⚡ {{speed_label}}</div>
  $(if error)<div class="error">$(error)</div>$(endif)
  <form name="login" action="$(link-login-only)" method="post"
        $(if chap-id) onSubmit="return doLogin()" $(endif)>
    <input type="hidden" name="dst" value="$(link-orig)" />
    <input type="hidden" name="popup" value="true" />
    <input name="username" type="text" value="$(username)" placeholder="اسم المستخدم / رقم الكرت" autocomplete="username" />
    <input name="password" type="password" placeholder="كلمة المرور" autocomplete="current-password" />
    <button type="submit">دخول</button>
  </form>
  $(if trial == 'yes')
  <div class="trial"><a href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)">دخول تجريبي مجاني ←</a></div>
  $(endif)
  <div class="foot">{{support_line}}</div>
</div>
</body>
</html>
