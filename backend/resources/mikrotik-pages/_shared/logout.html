<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{network_name}} — تم تسجيل الخروج</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", Tahoma, Arial, sans-serif;
  background: #f0f3f8; min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.card {
  background: #fff; width: 100%; max-width: 380px; border-radius: 18px;
  padding: 36px 26px 26px; text-align: center;
  box-shadow: 0 12px 40px rgba(20,30,60,.14);
}
.mark {
  width: 62px; height: 62px; margin: 0 auto 16px; border-radius: 50%;
  background: {{color_primary}}; color: #fff; font-size: 30px;
  display: flex; align-items: center; justify-content: center;
}
h1 { font-size: 21px; font-weight: 800; margin-bottom: 8px; }
p { color: #7a8494; font-size: 14px; margin-bottom: 20px; }
.stats { font-size: 13px; color: #556; margin-bottom: 22px; line-height: 1.9; }
.stats b { color: #1c2430; }
.btn {
  display: inline-block; padding: 13px 34px; border-radius: 10px;
  background: {{color_accent}}; color: #fff; font-weight: 700;
  text-decoration: none; font-size: 15px;
}
.foot { margin-top: 24px; font-size: 12px; color: #889; }
</style>
</head>
<body>
<div class="card">
  <div class="mark">✓</div>
  <h1>تم تسجيل خروجك</h1>
  <p>شكراً لاستخدامك {{network_name}}</p>
  $(if username)
  <div class="stats">
    المستخدم: <b>$(username)</b><br>
    مدة الجلسة: <b>$(uptime)</b><br>
    الاستهلاك: <b>$(bytes-in-nice) ↓ / $(bytes-out-nice) ↑</b>
  </div>
  $(endif)
  <a class="btn" href="$(link-login)">العودة لتسجيل الدخول</a>
  <div class="foot">{{support_line}}</div>
</div>
</body>
</html>
