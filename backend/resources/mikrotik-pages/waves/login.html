<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{network_name}} — تسجيل الدخول</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", Tahoma, "Helvetica Neue", Arial, sans-serif;
  min-height: 100vh; display: flex; flex-direction: column;
  background: linear-gradient(160deg, {{color_primary}} 0%, {{color_accent}} 220%);
  color: #233;
}
.hero {
  flex: 0 0 220px; position: relative; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: #fff; text-align: center; padding: 20px;
}
.hero::before, .hero::after {
  content: ""; position: absolute; border-radius: 50%;
  background: rgba(255,255,255,.06);
}
.hero::before { width: 180px; height: 180px; top: -80px; right: -60px; }
.hero::after { width: 120px; height: 120px; bottom: 0; left: -40px; }
.hero > * { position: relative; }
.hero .logo { max-height: 58px; max-width: 130px; margin-bottom: 10px; }
.hero h1 { font-size: 25px; font-weight: 800; text-shadow: 0 2px 14px rgba(0,0,0,.25); }
.hero p { font-size: 13px; opacity: .9; margin-top: 6px; }
.wave { display: block; width: 100%; height: 62px; margin-top: -1px; }
.main {
  flex: 1; background: #f4f7fb; padding: 0 16px 26px;
  display: flex; justify-content: center;
}
.card {
  background: #fff; width: 100%; max-width: 400px; height: fit-content;
  margin-top: -32px; border-radius: 20px; padding: 28px 22px;
  box-shadow: 0 18px 40px rgba(15,40,80,.18); position: relative; z-index: 2;
  animation: rise .45s ease both;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: none; }
}
input[type=text], input[type=password] {
  width: 100%; padding: 15px; margin-bottom: 12px;
  border: 1.5px solid #dfe7f1; border-radius: 13px;
  font-size: 15px; font-family: inherit; background: #fbfdff;
  transition: border-color .15s, box-shadow .15s;
}
input:focus {
  outline: none; border-color: {{color_primary}};
  box-shadow: 0 0 0 4px rgba(30, 60, 130, .07);
}
button {
  width: 100%; padding: 16px; border: 0; border-radius: 13px;
  background: linear-gradient(135deg, {{color_accent}} 0%, {{color_primary}} 190%);
  color: #fff; font-size: 16px; font-weight: 800; font-family: inherit;
  cursor: pointer; box-shadow: 0 9px 20px rgba(0,0,0,.15);
  transition: transform .12s, box-shadow .15s;
}
button:hover { transform: translateY(-1px); box-shadow: 0 13px 26px rgba(0,0,0,.2); }
button:active { transform: none; }
.error {
  background: #fdecea; color: #b3261e; border-radius: 11px;
  padding: 11px; font-size: 13px; margin-bottom: 14px; text-align: center;
}
.trial { text-align: center; margin-top: 16px; font-size: 13px; color: #556; }
.trial a { color: {{color_accent}}; font-weight: 800; text-decoration: none; }
.trial a:hover { text-decoration: underline; }
.foot { text-align: center; font-size: 12px; color: #8a97a8; padding: 12px 0; background: #f4f7fb; }
.foot a { color: {{color_primary}}; text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
$(if chap-id)
<form name="sendin" action="$(link-login-only)" method="post">
<input type="hidden" name="username" />
<input type="hidden" name="password" />
<input type="hidden" name="dst" value="$(link-orig)" />
<input type="hidden" name="popup" value="true" />
</form>
<script type="text/javascript" src="md5.js"></script>
<script type="text/javascript">
function doLogin() {
  document.sendin.username.value = document.login.username.value;
  document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
  document.sendin.submit();
  return false;
}
</script>
$(endif)

<div class="hero">
  {{logo}}
  <h1>{{network_name}}</h1>
  <p>{{welcome_msg}}</p>
</div>
<svg class="wave" viewBox="0 0 1440 62" preserveAspectRatio="none">
  <path d="M0,32 C240,62 480,0 720,20 C960,42 1200,56 1440,26 L1440,62 L0,62 Z" fill="#f4f7fb"/>
</svg>
<div class="main">
  <div class="card">
    $(if error)<div class="error">$(error)</div>$(endif)
    <form name="login" action="$(link-login-only)" method="post"
          $(if chap-id) onSubmit="return doLogin()" $(endif)>
      <input type="hidden" name="dst" value="$(link-orig)" />
      <input type="hidden" name="popup" value="true" />
      <input name="username" type="text" value="$(username)"
             placeholder="اسم المستخدم / رقم الكرت" autocomplete="username" />
      <input name="password" type="password"
             placeholder="كلمة المرور" autocomplete="current-password" />
      <button type="submit">دخول</button>
    </form>
    $(if trial == 'yes')
    <div class="trial">
      <a href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)">جرّب مجاناً بدون كرت</a>
    </div>
    $(endif)
  </div>
</div>
<div class="foot">{{support_line}}</div>
</body>
</html>
