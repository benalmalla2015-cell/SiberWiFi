<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{network_name}} — تسجيل الدخول</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 18px;
  background: radial-gradient(ellipse at 50% 0%, #1e1b4b 0%, #0a0a1a 70%);
  overflow-x: hidden; }
.stars { position: fixed; inset: 0; pointer-events: none;
  background-image:
    radial-gradient(1.5px 1.5px at 15% 20%, #fff 50%, transparent 50%),
    radial-gradient(1px 1px at 75% 12%, #c7d2fe 50%, transparent 50%),
    radial-gradient(1.5px 1.5px at 45% 75%, #fff 50%, transparent 50%),
    radial-gradient(1px 1px at 88% 60%, #a5b4fc 50%, transparent 50%),
    radial-gradient(1.2px 1.2px at 25% 85%, #fff 50%, transparent 50%),
    radial-gradient(1px 1px at 60% 40%, #e0e7ff 50%, transparent 50%),
    radial-gradient(1.5px 1.5px at 92% 88%, #fff 50%, transparent 50%);
  animation: twinkle 4s ease-in-out infinite alternate; }
@keyframes twinkle { from { opacity: .55; } to { opacity: 1; } }
.orbit { position: fixed; width: 480px; height: 480px; border: 1px solid
  rgba(129,140,248,.18); border-radius: 50%; top: -160px; right: -140px;
  animation: spin 30s linear infinite; pointer-events: none; }
.orbit::after { content: ''; position: absolute; width: 12px; height: 12px;
  border-radius: 50%; background: {{color_accent}}; top: -6px; left: 50%;
  box-shadow: 0 0 16px {{color_accent}}; }
@keyframes spin { to { transform: rotate(360deg); } }
.card { width: 100%; max-width: 390px; padding: 38px 28px 26px; text-align: center;
  background: rgba(20,18,50,.85); border: 1px solid rgba(129,140,248,.25);
  border-radius: 26px; backdrop-filter: blur(10px); position: relative;
  box-shadow: 0 30px 70px rgba(0,0,0,.5); animation: up .5s ease both; }
@keyframes up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; } }
.logo { max-height: 62px; max-width: 140px; margin-bottom: 8px; }
.planet { font-size: 38px; display: block; margin-bottom: 6px;
  filter: drop-shadow(0 0 20px rgba(129,140,248,.6)); }
h1 { font-size: 25px; color: #e0e7ff; font-weight: 800; }
.sub { color: #818cf8; font-size: 13px; margin: 8px 0 20px; line-height: 1.7; }
.speed { display: inline-block; color: #c7d2fe; font-size: 12px; font-weight: 700;
  border: 1px solid rgba(129,140,248,.4); border-radius: 999px; padding: 4px 14px;
  margin-bottom: 14px; background: rgba(129,140,248,.08); }
.speed:empty { display: none; }
input[type=text], input[type=password] { width: 100%; padding: 15px 16px; margin-bottom: 13px;
  border: 1px solid rgba(129,140,248,.3); border-radius: 14px;
  background: rgba(10,10,30,.6); font-size: 15px; font-family: inherit;
  text-align: center; color: #e0e7ff; transition: border .15s, box-shadow .15s; }
input::placeholder { color: #4c4f80; }
input:focus { outline: none; border-color: {{color_accent}};
  box-shadow: 0 0 20px rgba(129,140,248,.25); }
button { width: 100%; padding: 15px; border: 0; border-radius: 14px;
  background: linear-gradient(135deg, {{color_accent}}, {{color_primary}} 160%);
  color: #fff; font-size: 16px; font-weight: 800; font-family: inherit; cursor: pointer;
  box-shadow: 0 10px 30px rgba(129,140,248,.3); transition: transform .12s; }
button:hover { transform: translateY(-1px); }
.error { background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.4);
  color: #fca5a5; border-radius: 12px; padding: 11px; font-size: 13px; margin-bottom: 14px; }
.trial { margin-top: 17px; font-size: 13px; color: #4c4f80; }
.trial a { color: #c7d2fe; font-weight: 800; text-decoration: none; }
.foot { margin-top: 22px; font-size: 12px; color: #3a3d66; }
.foot a { color: #c7d2fe; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
$(if chap-id)
<form name="sendin" action="$(link-login-only)" method="post">
<input type="hidden" name="username" />
<input type="hidden" name="password" />
<input type="hidden" name="dst" value="$(link-orig)" />
<input type="hidden" name="popup" value="true" />
</form>
<script type="text/javascript" src="md5.js"></script>
<script type="text/javascript">
function doLogin() {
  document.sendin.username.value = document.login.username.value;
  document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
  document.sendin.submit();
  return false;
}
</script>
$(endif)

<div class="stars"></div><div class="orbit"></div>
<div class="card">
  <span class="planet">🪐</span>
  {{logo}}
  <h1>{{network_name}}</h1>
  <div class="sub">{{welcome_msg}}</div>
  <div class="speed">⚡ {{speed_label}}</div>
  $(if error)<div class="error">$(error)</div>$(endif)
  <form name="login" action="$(link-login-only)" method="post"
        $(if chap-id) onSubmit="return doLogin()" $(endif)>
    <input type="hidden" name="dst" value="$(link-orig)" />
    <input type="hidden" name="popup" value="true" />
    <input name="username" type="text" value="$(username)" placeholder="اسم المستخدم / رقم الكرت" autocomplete="username" />
    <input name="password" type="password" placeholder="كلمة المرور" autocomplete="current-password" />
    <button type="submit">🚀 دخول</button>
  </form>
  $(if trial == 'yes')
  <div class="trial"><a href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)">دخول تجريبي مجاني ←</a></div>
  $(endif)
  <div class="foot">{{support_line}}</div>
</div>
</body>
</html>
