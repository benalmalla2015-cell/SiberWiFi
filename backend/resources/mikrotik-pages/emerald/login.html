<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{network_name}} — تسجيل الدخول</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; min-height: 100vh;
  display: flex; align-items: center; justify-content: center; padding: 18px;
  background: linear-gradient(170deg, #ecfdf5 0%, #d1fae5 60%, #a7f3d0 100%); }
.card { width: 100%; max-width: 390px; padding: 0 0 26px; text-align: center;
  background: #fff; border-radius: 24px; overflow: hidden;
  box-shadow: 0 24px 55px rgba(4,120,87,.18); animation: up .45s ease both; }
@keyframes up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; } }
.head { background: linear-gradient(135deg, {{color_primary}}, {{color_accent}});
  padding: 30px 24px 34px; border-radius: 0 0 40px 40px; color: #fff; }
.head .logo { max-height: 58px; max-width: 130px; margin-bottom: 6px;
  background: rgba(255,255,255,.9); border-radius: 12px; padding: 6px 10px; }
h1 { font-size: 24px; font-weight: 800; text-shadow: 0 1px 6px rgba(0,0,0,.15); }
.head .sub { color: rgba(255,255,255,.9); font-size: 13px; margin-top: 6px; line-height: 1.7; }
.body { padding: 24px 28px 0; }
.speed { display: inline-block; background: #ecfdf5; color: {{color_primary}};
  border: 1px solid #a7f3d0; border-radius: 999px; font-size: 12px; font-weight: 700;
  padding: 4px 14px; margin-bottom: 14px; }
.speed:empty { display: none; }
input[type=text], input[type=password] { width: 100%; padding: 15px 16px; margin-bottom: 13px;
  border: 2px solid #d1fae5; border-radius: 14px; background: #f8fffb; font-size: 15px;
  font-family: inherit; text-align: center; transition: border .15s; }
input:focus { outline: none; border-color: {{color_accent}}; }
button { width: 100%; padding: 15px; border: 0; border-radius: 14px;
  background: linear-gradient(135deg, {{color_accent}}, {{color_primary}});
  color: #fff; font-size: 16px; font-weight: 800; font-family: inherit; cursor: pointer;
  box-shadow: 0 10px 24px rgba(16,185,129,.35); transition: transform .12s; }
button:hover { transform: translateY(-1px); }
.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca;
  border-radius: 12px; padding: 11px; font-size: 13px; margin-bottom: 14px; }
.trial { margin-top: 16px; font-size: 13px; color: #6b7f77; }
.trial a { color: {{color_primary}}; font-weight: 800; text-decoration: none; }
.foot { margin-top: 20px; font-size: 12px; color: #9ca3af; }
.foot a { color: {{color_primary}}; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
$(if chap-id)
<form name="sendin" action="$(link-login-only)" method="post">
<input type="hidden" name="username" />
<input type="hidden" name="password" />
<input type="hidden" name="dst" value="$(link-orig)" />
<input type="hidden" name="popup" value="true" />
</form>
<script type="text/javascript" src="md5.js"></script>
<script type="text/javascript">
function doLogin() {
  document.sendin.username.value = document.login.username.value;
  document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
  document.sendin.submit();
  return false;
}
</script>
$(endif)

<div class="card">
  <div class="head">
    {{logo}}
    <h1>{{network_name}}</h1>
    <div class="sub">{{welcome_msg}}</div>
  </div>
  <div class="body">
    <div class="speed">⚡ {{speed_label}}</div>
    $(if error)<div class="error">$(error)</div>$(endif)
    <form name="login" action="$(link-login-only)" method="post"
          $(if chap-id) onSubmit="return doLogin()" $(endif)>
      <input type="hidden" name="dst" value="$(link-orig)" />
      <input type="hidden" name="popup" value="true" />
      <input name="username" type="text" value="$(username)" placeholder="اسم المستخدم / رقم الكرت" autocomplete="username" />
      <input name="password" type="password" placeholder="كلمة المرور" autocomplete="current-password" />
      <button type="submit">دخول</button>
    </form>
    $(if trial == 'yes')
    <div class="trial"><a href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)">دخول تجريبي مجاني ←</a></div>
    $(endif)
    <div class="foot">{{support_line}}</div>
  </div>
</div>
</body>
</html>
