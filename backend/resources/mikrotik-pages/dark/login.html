<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{network_name}} — تسجيل الدخول</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", Tahoma, "Helvetica Neue", Arial, sans-serif;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(255,255,255,.06) 0%, transparent 60%),
    radial-gradient(1200px 700px at 50% -10%, #2a3560 0%, {{color_primary}} 55%);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 20px; color: #e8ecf6;
}
.card {
  width: 100%; max-width: 400px; text-align: center;
  animation: rise .5s ease both;
}
@keyframes rise {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: none; }
}
.logo { max-height: 70px; max-width: 150px; margin-bottom: 14px; }
h1 {
  font-size: 27px; font-weight: 800; letter-spacing: .3px;
  text-shadow: 0 0 34px rgba(255,255,255,.18);
}
.sub { color: #9aa4c4; font-size: 13px; margin: 10px 0 26px; line-height: 1.7; }
.panel {
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.11);
  border-radius: 20px; padding: 26px 22px;
  box-shadow: 0 24px 55px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06);
  backdrop-filter: blur(10px);
}
input[type=text], input[type=password] {
  width: 100%; padding: 15px 16px; margin-bottom: 12px;
  background: rgba(255,255,255,.07); border: 1.5px solid rgba(255,255,255,.13);
  border-radius: 13px; color: #fff; font-size: 15px; font-family: inherit;
  transition: border-color .15s, background .15s, box-shadow .15s;
}
input::placeholder { color: #8a93b8; }
input:focus {
  outline: none; border-color: {{color_accent}};
  background: rgba(255,255,255,.09);
  box-shadow: 0 0 0 4px rgba(255,255,255,.05);
}
button {
  width: 100%; padding: 16px; border: 0; border-radius: 13px;
  background: linear-gradient(135deg, {{color_accent}} 0%, #ff7a4d 190%);
  color: #141a2e;
  font-size: 16px; font-weight: 800; font-family: inherit; cursor: pointer;
  box-shadow: 0 10px 26px rgba(0,0,0,.35);
  transition: transform .12s, opacity .15s;
}
button:hover { transform: translateY(-1px); }
button:active { transform: none; opacity: .9; }
.error {
  background: rgba(255,80,80,.14); border: 1px solid rgba(255,80,80,.3);
  color: #ff9d9d; border-radius: 11px; padding: 11px;
  font-size: 13px; margin-bottom: 14px;
}
.trial { margin-top: 18px; font-size: 13px; color: #8a93b8; }
.trial a { color: {{color_accent}}; font-weight: 700; text-decoration: none; }
.trial a:hover { text-decoration: underline; }
.foot { margin-top: 24px; font-size: 12px; color: #6d7699; }
.foot a { color: #cdd5ef; text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
$(if chap-id)
<form name="sendin" action="$(link-login-only)" method="post">
<input type="hidden" name="username" />
<input type="hidden" name="password" />
<input type="hidden" name="dst" value="$(link-orig)" />
<input type="hidden" name="popup" value="true" />
</form>
<script type="text/javascript" src="md5.js"></script>
<script type="text/javascript">
function doLogin() {
  document.sendin.username.value = document.login.username.value;
  document.sendin.password.value = hexMD5('$(chap-id)' + document.login.password.value + '$(chap-challenge)');
  document.sendin.submit();
  return false;
}
</script>
$(endif)

<div class="card">
  {{logo}}
  <h1>{{network_name}}</h1>
  <div class="sub">{{welcome_msg}}</div>
  <div class="panel">
    $(if error)<div class="error">$(error)</div>$(endif)
    <form name="login" action="$(link-login-only)" method="post"
          $(if chap-id) onSubmit="return doLogin()" $(endif)>
      <input type="hidden" name="dst" value="$(link-orig)" />
      <input type="hidden" name="popup" value="true" />
      <input name="username" type="text" value="$(username)"
             placeholder="اسم المستخدم / رقم الكرت" autocomplete="username" />
      <input name="password" type="password"
             placeholder="كلمة المرور" autocomplete="current-password" />
      <button type="submit">دخول</button>
    </form>
    $(if trial == 'yes')
    <div class="trial">
      <a href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)">تجربة مجانية</a>
    </div>
    $(endif)
  </div>
  <div class="foot">{{support_line}}</div>
</div>
</body>
</html>
