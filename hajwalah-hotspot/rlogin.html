<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<meta http-equiv="refresh" content="60">
<title>شبكة هجولة | جلستك</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-fx" aria-hidden="true"></div>
<div class="bg-grid" aria-hidden="true"></div>

<div class="brand-row" style="margin-top:18px">
  <img src="img/logo.svg" alt="شعار هجولة" width="44" height="44">
  <h1 class="brand-name" style="font-size:1.15rem">شبكة هجولة</h1>
</div>

<main class="card center" style="margin-top:14px">
  <span class="status-pill"><i class="pulse"></i> متصل</span>
  <div class="stat-grid" style="text-align:start">
    <div class="stat">
      <span class="k">مدة الاتصال</span>
      <div class="v" id="stUptime">$(uptime)</div>
    </div>
    <div class="stat">
      <span class="k">الوقت المتبقي</span>
      <div class="v" id="stLeft">$(session-time-left)</div>
    </div>
    <div class="stat">
      <span class="k">تحميل</span>
      <div class="v" id="stDown">$(bytes-in-nice)</div>
    </div>
    <div class="stat">
      <span class="k">رفع</span>
      <div class="v" id="stUp">$(bytes-out-nice)</div>
    </div>
  </div>
  <form action="$(link-logout)" method="post">
    <button type="submit" class="btn btn-ghost">قطع الاتصال</button>
  </form>
</main>

<footer><span>شبكة هجولة</span></footer>

<script src="js/demo.js"></script>
<script>
(function () {
  var demo = { stUptime: '01:24:36', stLeft: '04:35:24', stDown: '182.4 MiB', stUp: '36.9 MiB' };
  Object.keys(demo).forEach(function (id) {
    var el = document.getElementById(id);
    if (el && (el.textContent.indexOf('$(') !== -1 || el.textContent.trim() === ''))
      el.textContent = demo[id];
  });
})();
</script>
</body>
</html>
