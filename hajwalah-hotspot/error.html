<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b18">
<title>شبكة هجولة | خطأ</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-fx" aria-hidden="true"></div>
<div class="bg-grid" aria-hidden="true"></div>

<div class="brand-row" style="margin-top:40px">
  <img src="img/logo.svg" alt="شعار هجولة" width="54" height="54">
  <h1 class="brand-name">شبكة هجولة</h1>
</div>

<main class="card center" style="margin-top:22px">
  <div class="big-icon err">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><circle cx="12" cy="16.5" r=".7" fill="currentColor"/></svg>
  </div>
  <h1 class="page-title">حدث خطأ غير متوقع</h1>
  <p class="lead">$(error)</p>
  <a class="btn" href="$(link-login)">العودة لصفحة الدخول</a>
</main>

<footer><span>شبكة هجولة © جميع الحقوق محفوظة — للدعم الفني اتصل بالوكيل</span></footer>
<script src="js/demo.js"></script>
</body>
</html>
