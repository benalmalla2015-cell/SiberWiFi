<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="شعار شبكة هجولة">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a1a"/>
      <stop offset=".55" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="needle" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <radialGradient id="core" cx=".5" cy=".45" r=".65">
      <stop offset="0" stop-color="#16213d"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- خلفية الشعار -->
  <circle cx="120" cy="120" r="112" fill="url(#core)"/>
  <circle cx="120" cy="120" r="112" fill="none" stroke="url(#ring)" stroke-width="5"/>

  <!-- عداد سرعة: علامات التدريج -->
  <g stroke="#3b4a6b" stroke-width="6" stroke-linecap="round">
    <line x1="52"  y1="150" x2="66"  y2="142"/>
    <line x1="44"  y1="120" x2="60"  y2="120"/>
    <line x1="52"  y1="90"  x2="66"  y2="98"/>
    <line x1="72"  y1="66"  x2="83"  y2="77"/>
    <line x1="120" y1="52"  x2="120" y2="68"/>
    <line x1="168" y1="66"  x2="157" y2="77"/>
  </g>
  <g stroke="#ff7a1a" stroke-width="6" stroke-linecap="round" filter="url(#glow)">
    <line x1="188" y1="90"  x2="174" y2="98"/>
    <line x1="196" y1="120" x2="180" y2="120"/>
    <line x1="188" y1="150" x2="174" y2="142"/>
  </g>

  <!-- إبرة العداد باتجاه السرعة القصوى -->
  <g transform="rotate(48 120 132)" filter="url(#glow)">
    <line x1="120" y1="132" x2="120" y2="62" stroke="url(#needle)" stroke-width="9" stroke-linecap="round"/>
  </g>
  <circle cx="120" cy="132" r="14" fill="#0a0f1e" stroke="url(#needle)" stroke-width="5"/>

  <!-- أقواس واي فاي أعلى العداد -->
  <g fill="none" stroke="url(#arc)" stroke-width="9" stroke-linecap="round" filter="url(#glow)">
    <path d="M78 188 a60 60 0 0 1 84 0"/>
  </g>
  <g fill="none" stroke="url(#arc)" stroke-width="9" stroke-linecap="round" opacity=".72">
    <path d="M94 203 a38 38 0 0 1 52 0"/>
  </g>
  <circle cx="120" cy="214" r="8" fill="#22d3ee" filter="url(#glow)"/>

  <!-- خطوط سرعة (دريفت) -->
  <g stroke="#ff7a1a" stroke-width="7" stroke-linecap="round" opacity=".9">
    <line x1="30" y1="170" x2="58" y2="170"/>
    <line x1="24" y1="186" x2="48" y2="186"/>
  </g>
</svg>
