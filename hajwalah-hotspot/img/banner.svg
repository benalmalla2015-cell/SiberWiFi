<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" preserveAspectRatio="xMidYMid slice" role="img" aria-label="بانر شبكة هجولة">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset=".6" stop-color="#0d1530"/>
      <stop offset="1" stop-color="#101a3a"/>
    </linearGradient>
    <radialGradient id="glowO" cx=".82" cy=".35" r=".55">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx=".15" cy=".55" r=".5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2542"/>
      <stop offset="1" stop-color="#0a0f1e"/>
    </linearGradient>
    <linearGradient id="dash" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset=".55" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ff5e3a"/>
    </linearGradient>
    <linearGradient id="wifi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <pattern id="checker" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#e8ecf5" opacity=".85"/>
      <rect x="14" y="14" width="14" height="14" fill="#e8ecf5" opacity=".85"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#sky)"/>
  <rect width="1200" height="420" fill="url(#glowO)"/>
  <rect width="1200" height="420" fill="url(#glowC)"/>

  <!-- نجوم خافتة -->
  <g fill="#9fb4ff">
    <circle cx="120" cy="60" r="1.6" opacity=".5"/><circle cx="260" cy="40" r="1.2" opacity=".4"/>
    <circle cx="420" cy="80" r="1.4" opacity=".45"/><circle cx="640" cy="50" r="1.2" opacity=".35"/>
    <circle cx="860" cy="70" r="1.5" opacity=".4"/><circle cx="1050" cy="45" r="1.3" opacity=".5"/>
    <circle cx="760" cy="30" r="1" opacity=".3"/><circle cx="540" cy="36" r="1.2" opacity=".35"/>
  </g>

  <!-- خطوط سرعة أفقية -->
  <g stroke-linecap="round">
    <line x1="60"  y1="150" x2="330" y2="150" stroke="#22d3ee" stroke-width="4" opacity=".28"/>
    <line x1="110" y1="185" x2="430" y2="185" stroke="#22d3ee" stroke-width="3" opacity=".18"/>
    <line x1="40"  y1="220" x2="300" y2="220" stroke="#ff7a1a" stroke-width="4" opacity=".25"/>
    <line x1="150" y1="118" x2="380" y2="118" stroke="#7dd3fc" stroke-width="3" opacity=".2"/>
    <line x1="700" y1="96"  x2="900" y2="96"  stroke="#ff7a1a" stroke-width="3" opacity=".18"/>
    <line x1="820" y1="130" x2="980" y2="130" stroke="#22d3ee" stroke-width="3" opacity=".2"/>
  </g>

  <!-- أيقونة الواي فاي المتوهجة يساراً -->
  <g transform="translate(170 300)" fill="none" stroke="url(#wifi)" stroke-linecap="round" filter="url(#soft)">
    <path d="M-95 -55 a135 135 0 0 1 190 0" stroke-width="13" opacity=".95"/>
    <path d="M-64 -22 a92 92 0 0 1 128 0" stroke-width="12" opacity=".85"/>
    <path d="M-34 10 a50 50 0 0 1 68 0" stroke-width="11" opacity=".8"/>
    <circle r="12" fill="#22d3ee" stroke="none"/>
  </g>

  <!-- الطريق المنظوري -->
  <polygon points="0,420 1200,420 760,318 440,318" fill="url(#road)"/>
  <polygon points="586,420 614,420 606,322 594,322" fill="url(#dash)"/>
  <g fill="#ffb347" opacity=".85">
    <polygon points="596,404 604,404 602,380 598,380"/>
    <polygon points="598,368 602,368 601,350 599,350"/>
    <polygon points="599,342 601,342 600,330 600,330"/>
  </g>
  <line x1="440" y1="318" x2="0"   y2="420" stroke="#3b4a6b" stroke-width="3"/>
  <line x1="760" y1="318" x2="1200" y2="420" stroke="#3b4a6b" stroke-width="3"/>

  <!-- أثر إطارات (دريفت) -->
  <g fill="none" stroke-linecap="round">
    <path d="M120 392 q160 -70 420 -58" stroke="#ff7a1a" stroke-width="8" opacity=".5"/>
    <path d="M120 404 q160 -64 420 -50" stroke="#ff5e3a" stroke-width="5" opacity=".35"/>
  </g>

  <!-- شريط علم السباق -->
  <rect x="0" y="392" width="1200" height="28" fill="url(#checker)" opacity=".16"/>

  <!-- العنوان -->
  <g text-anchor="middle" font-family="'Segoe UI', Tahoma, Arial, sans-serif">
    <text x="620" y="185" font-size="92" font-weight="800" fill="url(#title)" filter="url(#soft)">شبكة هجولة</text>
    <text x="620" y="248" font-size="34" font-weight="600" fill="#dbe6ff" opacity=".92">إنترنت بسرعة الانجراف</text>
    <g>
      <rect x="510" y="272" width="220" height="40" rx="20" fill="#ff7a1a" opacity=".14"/>
      <rect x="510" y="272" width="220" height="40" rx="20" fill="none" stroke="#ff7a1a" stroke-width="1.6" opacity=".55"/>
      <text x="620" y="299" font-size="21" font-weight="700" fill="#ffb347">HAJWALAH NETWORK</text>
    </g>
  </g>
</svg>
