# -*- text -*-
# =============================================================================
# CyberNet — RADIUS clients (NAS = host MikroTik routers)
#
# Every onboarded host gets its own `client` block with a unique 40-char
# secret generated by host-templates/generate-host.py (the block it emits
# in <host>.server.conf is appended verbatim to this file).
#
# Hosts reach this server over WireGuard — ipaddr is the host's tunnel IP.
# =============================================================================

# Loopback — local radclient/radtest diagnostics only.
client localhost {
	ipaddr		= 127.0.0.1
	secret		= testing123
	nas_type	= other
	require_message_authenticator = no
}

# -----------------------------------------------------------------------------
# Pilot host (المعلا / أول مضيف مؤسس)
# Generated by: host-templates/generate-host.py --host-id HOST_PILOT
# Replace the secret with the value emitted in generated/HOST_PILOT.server.conf.
# -----------------------------------------------------------------------------
client HOST_PILOT {
	ipaddr		= 127.0.0.2			# host WireGuard tunnel IP (placeholder)
	secret		= __HOST_PILOT_RADIUS_SECRET__	# placeholder — paste generated secret
	nas_type	= mikrotik
	proto		= udp
	require_message_authenticator = yes

	limit {
		max_connections = 16
		lifetime        = 0
		idle_timeout    = 30
	}
}

# -----------------------------------------------------------------------------
# Pilot host v6 — almalla-001 (المعلا — MikroTik RouterOS v6)
# v6 lacks WireGuard: NAS reaches us on public UDP. ipaddr opened for pilot;
# restrict to the host's real WAN IP once known.
# -----------------------------------------------------------------------------
client almalla-v6-001 {
	ipaddr		= 0.0.0.0/0
	secret		= xQpnemBiIx13oINunewselTUE7XXQ3KdTgLHZ5IC
	nas_type	= mikrotik
	proto		= udp
	require_message_authenticator = yes
	limit {
		max_connections = 16
		lifetime        = 0
		idle_timeout    = 30
	}
}
